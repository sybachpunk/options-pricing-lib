# Two jobs:
#   pure-python    — minimal deps, no compiler; the C++ parity tests skip.
#   with-cpp-engine — builds the pybind11 extension and runs the full suite,
#                     including the C++/Python parity tests.
name: tests

on:
  push:
  pull_request:

jobs:
  pure-python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # conftest.py puts src/ on sys.path, so no package install is needed
      - run: pip install numpy scipy pytest
      - run: pytest -q

  with-cpp-engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: OPTIONS_PRICING_BUILD_CPP=1 pip install -e ".[dev]"
      - run: pytest -q
